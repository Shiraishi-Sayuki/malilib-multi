pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = uri('https://maven.fabricmc.net')
		}
		maven {
			name = 'NeoForged'
			url = uri('https://maven.neoforged.net/releases')
		}
		maven {
			name = 'Architectury'
			url = uri('https://maven.architectury.dev/')
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// This should match the folder name of the project, or else IDEA may complain
rootProject.name = 'malilib-multiloader'
include('common')
include('fabric')
include('neoforge')
