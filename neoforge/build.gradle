plugins {
	id 'dev.architectury.loom'
	id 'maven-publish'
}

repositories {
	maven { url = 'https://api.modrinth.com/maven' }
	maven { url = 'https://maven.neoforged.net/releases' }
	maven { url = 'https://maven.architectury.dev/' }
	maven { url = 'https://maven.terraformersmc.com/releases/'
		content { includeGroupAndSubgroups("com.terraformersmc") }
	}
	maven { url = 'https://maven.fallenbreath.me/releases'
		content { includeGroupAndSubgroups("me.fallenbreath") }
	}
}

configurations {
	commonJava {
		canBeResolved = true
	}
	commonResources {
		canBeResolved = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.layered {
		mappings "net.fabricmc:yarn:${project.mappings_version}:v2"
		mappings "dev.architectury:yarn-mappings-patch-neoforge:${yarn_mappings_patch_neoforge}"
	}
	neoForge "net.neoforged:neoforge:${project.neoforge_version}"

	implementation "com.google.code.findbugs:jsr305:3.0.2"
	compileOnly "org.jetbrains:annotations:24.1.0"

	commonJava project(path: ':common', configuration: 'commonJava')
	commonResources project(path: ':common', configuration: 'commonResources')
}

// Compile common sources directly with official (patched) mappings (single remap pass)
// Exclude loader-specific mixins that are overridden in this module
tasks.named('compileJava', JavaCompile) {
	dependsOn(configurations.commonJava)
	def commonSrcDir = configurations.commonJava.singleFile
	source(files(commonSrcDir).asFileTree.matching { exclude '**/mixin/screen/MixinHandledScreen.java' })
}

base {
	archivesName = "malilib-neoforge-${project.minecraft_version_out}"
	group = project.group + "." + project.mod_id
	version = project.mod_version
	if (version.endsWith('-dev')) {
		version += "." + new Date().format('yyyyMMdd.HHmmss')
	}
}

loom {
	accessWidenerPath = file("src/main/resources/malilib.accesswidener")
	mixin {
		useLegacyMixinAp = true
		defaultRefmapName.set("malilib.refmap.json")
	}
}

processResources {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from(configurations.commonResources) {
		exclude '**/malilib.accesswidener'
		exclude '**/*.xcf'
		exclude '**/xcf'
	}
	inputs.property "mod_version", project.mod_version
	filesMatching("META-INF/neoforge.mods.toml") {
		expand "mod_version": project.mod_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
	withSourcesJar()
}

jar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from(rootProject.file("LICENSE")) {
		rename { "${it}_${base.archivesName}"}
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			artifactId = base.archivesName.get()
			from components.java
		}
	}
	repositories {
		maven {
			url = "${rootProject.projectDir}/CommonMaven"
		}
	}
}
