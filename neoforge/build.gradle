plugins {
	id 'net.neoforged.moddev'
	id 'maven-publish'
}

repositories {
	maven { url = 'https://libraries.minecraft.net' }
	maven { url = 'https://maven.neoforged.net/releases' }
	maven { url = 'https://maven.architectury.dev/' }
	maven { url = 'https://api.modrinth.com/maven' }
	maven { url = 'https://maven.terraformersmc.com/releases/'
		content { includeGroupAndSubgroups("com.terraformersmc") }
	}
}

neoForge {
	enable {
		version = project.neoforge_version
		disableRecompilation = true
	}

	accessTransformers.from file("src/main/resources/META-INF/accesstransformer.cfg")

	mods {
		malilib {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	implementation "com.google.code.findbugs:jsr305:3.0.2"
	compileOnly "org.jetbrains:annotations:24.1.0"

	implementation project(path: ':common', configuration: 'commonJar')
}

base {
	archivesName = "malilib-neoforge-${project.minecraft_version_out}"
	group = project.group + "." + project.mod_id
	version = project.mod_version
	if (version.endsWith('-dev')) {
		version += "." + new Date().format('yyyyMMdd.HHmmss')
	}
}

processResources {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	inputs.property "mod_version", project.mod_version
	filesMatching("META-INF/neoforge.mods.toml") {
		expand "mod_version": project.mod_version
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

jar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from(rootProject.file("LICENSE")) {
		rename { "${it}_${base.archivesName}"}
	}
	// Include common module classes and resources
	from(project(':common').sourceSets.main.output.classesDirs)
	from(project(':common').sourceSets.main.resources) {
		exclude "fabric.mod.json"
		exclude "malilib.accesswidener"
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			artifactId = base.archivesName.get()
			from components.java
		}
	}
	repositories {
		maven {
			url = "${rootProject.projectDir}/CommonMaven"
		}
	}
}
