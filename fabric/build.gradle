plugins {
	id 'net.fabricmc.fabric-loom'
	id 'maven-publish'
}

configurations {
	commonJava {
		canBeResolved = true
	}
	commonResources {
		canBeResolved = true
	}
}

repositories {
	maven { url = 'https://maven.terraformersmc.com/releases/'
		content { includeGroupAndSubgroups("com.terraformersmc") }
	}
	maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
	implementation "com.google.code.findbugs:jsr305:3.0.2"
	include(api(fabricApi.module("fabric-api-base", project.fabric_api_version)))
	include(api(fabricApi.module("fabric-resource-loader-v0", project.fabric_api_version)))
	include(api(fabricApi.module("fabric-networking-api-v1", project.fabric_api_version)))
	implementation(api(fabricApi.module("fabric-data-generation-api-v1", project.fabric_api_version)))
	compileOnly "com.terraformersmc:modmenu:${project.mod_menu_version}"
	compileOnly "maven.modrinth:iris:${project.iris_version}+${project.iris_mc_version}-fabric"

	commonJava project(path: ':common', configuration: 'commonJava')
	commonResources project(path: ':common', configuration: 'commonResources')
}

// Compile common sources directly
tasks.named('compileJava', JavaCompile) {
	dependsOn(configurations.commonJava)
	source(configurations.commonJava)
}

base {
	group = project.group + "." + project.mod_id
	archivesName = "malilib-fabric-${project.minecraft_version_out}"
	version = project.mod_version
	if (version.endsWith('-dev')) {
		version += "." + new Date().format('yyyyMMdd.HHmmss')
	}
}

loom {
	accessWidenerPath = file("src/main/resources/malilib.accesswidener")
}

processResources {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from(configurations.commonResources) {
		exclude '**/malilib.accesswidener'
		exclude '**/mixins.malilib.json'
		exclude '**/*.xcf'
		exclude '**/xcf'
	}
	inputs.property "mod_version", project.mod_version
	filesMatching("fabric.mod.json") {
		expand "mod_version": project.mod_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	withSourcesJar()
}

jar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from(rootProject.file("LICENSE")) {
		rename { "${it}_${base.archivesName}"}
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			artifactId = base.archivesName.get()
			from components.java
		}
	}
	repositories {
		maven {
			url = "${rootProject.projectDir}/CommonMaven"
		}
	}
}
